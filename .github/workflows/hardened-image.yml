name: Build hardened Dashboard image

on:
  push:
    branches: [master]
    paths:
      - "Dockerfile.hardened"
      - "hardened-admin-dist/**"
      - "cmd/dashboard/**"
      - "model/**"
      - "service/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/hardened-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.hardened
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/guanzihao166/nezha-dashboard-hardened:latest
            ghcr.io/guanzihao166/nezha-dashboard-hardened:sha-${{ github.sha }}
